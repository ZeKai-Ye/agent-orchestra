[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-orchestra"
version = "0.2.0"
description = "Coordination control plane for many concurrent CLI coding agents"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
orchestra = "orchestra.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
orchestra = ["templates/*.toml"]